      stroke-linecap="round"
      stroke-linejoin="round"
      d="M-4.6 6L0-6l4.6 12M-2.5 2.2h5"
    />
  </g>

  <!-- Cream tile: K (front) -->
  <g transform="translate(32 24) rotate(7)">
    <rect x="-13.5" y="-13.5" width="27" height="27" rx="5.5" fill="url(#tileCream)" stroke="#f0a202" stroke-width="1.6"/>
    <path
      fill="none"
      stroke="#0e1f35"
      stroke-width="3.2"
      stroke-linecap="round"
      stroke-linejoin="round"
      d="M-5.5-7.5v15M-5.5 0l10-7.5M-5.5 0l10 7.5"
    />
  </g>

  <path d="M9 16l2.1 1L12.2 19l.2-2.2 2-1.1-2-1-.2-2.2-1.1 2z" fill="#f0a202"/>
  <path d="M53 48l1.5.75.75 1.55.1-1.55 1.5-.75-1.5-.75-.1-1.55-.75 1.5z" fill="#3ecf8e"/>
