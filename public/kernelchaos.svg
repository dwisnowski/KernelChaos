<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="KernelChaos">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f4268"/>
      <stop offset="1" stop-color="#0e1f35"/>
    </linearGradient>
    <linearGradient id="tileCream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f3e8"/>
      <stop offset="1" stop-color="#e7dfcb"/>
    </linearGradient>
    <linearGradient id="tileGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6d8"/>
      <stop offset="1" stop-color="#f0a202"/>
    </linearGradient>
    <linearGradient id="tileMint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8ffe9"/>
      <stop offset="1" stop-color="#3ecf8e"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#sky)"/>
  <circle cx="52" cy="12" r="11" fill="#f0a202" opacity="0.16"/>
  <circle cx="10" cy="54" r="13" fill="#3ecf8e" opacity="0.12"/>

  <!-- Mint tile: C (peeking right) -->
  <g transform="translate(44 33) rotate(22)">
    <rect x="-11" y="-11" width="22" height="22" rx="4.5" fill="url(#tileMint)"/>
    <path
      fill="none"
      stroke="#0e1f35"
      stroke-width="2.8"
      stroke-linecap="round"
      d="M5-3.4a5.8 5.8 0 1 0 0 6.8"
    />
  </g>

  <!-- Gold tile: A (peeking left) -->
  <g transform="translate(18 36) rotate(-20)">
    <rect x="-11" y="-11" width="22" height="22" rx="4.5" fill="url(#tileGold)"/>
    <path
      fill="none"
      stroke="#0e1f35"
